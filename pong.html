<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RonPingPong Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

        :root {
            --bg-dark: #1f2937;
            --surface-dark: #111827;
            --primary-color: #6ee7b7;
            --text-color: #e5e7eb;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .card {
            background-color: var(--surface-dark);
            border-radius: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        input, select {
            background-color: #374151;
            border: 1px solid #4b5563;
            color: var(--text-color);
            border-radius: 0.5rem;
            padding: 0.75rem;
            width: 100%;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(110, 231, 183, 0.5);
        }
        
        button {
            background-color: var(--primary-color);
            color: #1f2937;
            font-weight: bold;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #34d399;
            transform: translateY(-1px);
        }
        
        button:disabled {
            background-color: #4b5563;
            color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            color: var(--error-color);
            margin-top: 0.5rem;
            font-size: 0.875rem;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background-color: var(--surface-dark);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .toggle-switch-container {
          display: flex;
          align-items: center;
          gap: 1rem;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 24px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: var(--primary-color);
        }
        
        input:checked + .slider:before {
            transform: translateX(16px);
        }

        #gameCanvas {
            background-color: black;
            border: 2px solid white;
            border-radius: 0.5rem;
            cursor: none;
            width: 100%;
            aspect-ratio: 500 / 350;
            display: block;
            margin: auto;
        }

        .score-display {
            position: absolute;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid white;
            border-radius: 1rem;
            padding: 0.5rem 1rem;
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .lobby-list-container {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
            padding: 0.5rem;
            margin-top: 1rem;
        }

        .list-item {
            padding: 0.5rem;
            cursor: pointer;
            border-radius: 0.25rem;
            transition: background-color 0.2s;
        }
        
        .list-item:hover {
            background-color: #374151;
        }
        
        .list-item.selected {
            background-color: #60a5fa;
            color: black;
            font-weight: bold;
        }

        .chat-container {
            background-color: #1f2937;
            border-radius: 1rem;
            padding: 1rem;
            max-width: 350px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: fixed;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            height: 80%;
            display: flex;
            flex-direction: column;
            display: none;
        }
        
        .chat-container.active {
          display: flex;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 1rem;
            border: 1px solid #4b5563;
            padding: 0.5rem;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200">
    <div id="login-screen" class="screen active">
        <div class="card max-w-sm mx-auto my-auto p-8 rounded-2xl shadow-lg">
            <div class="flex flex-col items-center space-y-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-24 h-24 text-green-400" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8zm-2-9c0-.552-.448-1-1-1s-1 .448-1 1v2c0 .552.448 1 1 1s1-.448 1-1v-2zm4 0c0-.552-.448-1-1-1s-1 .448-1 1v2c0 .552.448 1 1 1s1-.448 1-1v-2z"/>
                </svg>
                <h1 class="text-3xl font-bold">RonPingPong</h1>
                <p id="error-message" class="text-red-500 hidden"></p>
                <div id="auth-fields" class="w-full flex flex-col space-y-4">
                    <input type="text" id="username" placeholder="Username" class="p-3 rounded-md bg-gray-700 border-none text-gray-200 focus:ring-2 focus:ring-green-400">
                    <input type="password" id="password" placeholder="Password" class="p-3 rounded-md bg-gray-700 border-none text-gray-200 focus:ring-2 focus:ring-green-400">
                    <button id="auth-button" class="w-full p-3 rounded-lg bg-green-400 text-gray-900 font-bold hover:bg-green-500 transition-colors">Login</button>
                    <button id="toggle-auth-button" class="w-full p-3 rounded-lg text-green-400 font-bold hover:underline">Don't have an account? Sign Up</button>
                </div>
                <div class="w-full flex items-center justify-center space-x-2">
                    <span class="text-sm">Play Offline:</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="offline-switch">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div id="lobby-screen" class="screen">
        <div class="card mx-auto my-auto p-8 rounded-2xl shadow-lg">
            <h1 class="text-3xl font-bold text-center">Welcome, <span id="lobby-username"></span></h1>
            <div class="mt-8 space-y-6">
                <div class="flex items-center space-x-4">
                    <label class="text-lg">Opponent:</label>
                    <select id="opponent-type" class="flex-grow p-2 rounded-lg bg-gray-700 border-none">
                        <option value="AI">AI</option>
                        <option value="Human">Human</option>
                    </select>
                </div>

                <div id="ai-options" class="flex items-center space-x-4">
                    <label class="text-lg">AI Difficulty:</label>
                    <select id="ai-difficulty" class="flex-grow p-2 rounded-lg bg-gray-700 border-none">
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
                
                <div class="flex items-center space-x-4">
                    <label class="text-lg">Win Points:</label>
                    <input type="number" id="win-points" value="5" min="1" class="w-24 p-2 rounded-lg bg-gray-700 border-none">
                </div>
                
                <div id="human-options" class="space-y-4" style="display: none;">
                    <button id="show-players-button" class="w-full py-3 rounded-lg bg-blue-500 text-white font-bold hover:bg-blue-600 transition-colors">Show Available Players</button>
                    <div id="online-users-list" class="lobby-list-container">
                        <p class="text-center text-gray-400">Loading players...</p>
                    </div>
                    <p id="invite-status" class="text-center text-gray-400"></p>
                    <div class="flex items-center space-x-2">
                        <input type="text" id="chat-input" placeholder="Message to opponent..." class="flex-grow p-3 rounded-lg bg-gray-700 border-none text-gray-200">
                        <button id="send-chat-button" class="p-3 rounded-lg bg-green-400 text-gray-900 font-bold hover:bg-green-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l4.47-1.49a1 1 0 00.5.074l7.108 2.373A1 1 0 0017 18.232l-7-14z"/></svg>
                        </button>
                    </div>
                    <div id="chat-log" class="lobby-list-container h-32"></div>
                </div>
                <div id="game-status" class="text-center text-xl text-green-400 mt-4 font-bold"></div>
                <button id="start-game-button" class="w-full py-3 rounded-lg bg-green-400 text-gray-900 font-bold hover:bg-green-500 transition-colors">
                    <span class="flex items-center justify-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg>
                        <span>Start Game</span>
                    </span>
                </button>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen flex flex-col items-center justify-center p-4">
        <h2 class="text-2xl font-bold mb-4">Pong vs <span id="game-opponent-name"></span></h2>
        <div class="relative w-full max-w-lg mb-4">
            <canvas id="gameCanvas" width="500" height="350"></canvas>
            <div id="game-score" class="score-display">0 : 0</div>
        </div>
        <div class="flex space-x-4">
            <button id="game-exit-button" class="py-2 px-4 rounded-lg bg-red-500 text-white font-bold hover:bg-red-600 transition-colors">Exit Game</button>
            <button id="game-chat-button" class="py-2 px-4 rounded-lg bg-blue-500 text-white font-bold hover:bg-blue-600 transition-colors">Chat</button>
        </div>
    </div>

    <!-- Modals (Initially hidden) -->
    <div id="help-modal" class="modal hidden">
        <div class="modal-content text-center">
            <h3 class="text-xl font-bold mb-4">Help</h3>
            <p>Sign up or log in to play with friends and save your game history.</p>
            <p class="mt-2">Or select 'Play Offline' to play against an AI opponent without an account.</p>
            <div class="modal-buttons">
                <button onclick="closeModal('help-modal')">Close</button>
            </div>
        </div>
    </div>
    
    <div id="invite-modal" class="modal hidden">
        <div class="modal-content text-center">
            <h3 class="text-xl font-bold mb-4">Game Invite</h3>
            <p id="invite-message"></p>
            <div class="modal-buttons">
                <button id="decline-invite-button">Decline</button>
                <button id="accept-invite-button">Accept</button>
            </div>
        </div>
    </div>

    <div id="game-chat-drawer" class="chat-container">
        <div class="flex items-center justify-between mb-2">
            <h3 class="text-lg font-bold">Chat</h3>
            <button onclick="document.getElementById('game-chat-drawer').classList.remove('active')" class="text-gray-400 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
        </div>
        <div id="game-chat-messages" class="chat-messages"></div>
        <div class="flex space-x-2">
            <input type="text" id="game-chat-input" placeholder="Type a message..." class="flex-grow p-2 rounded-lg bg-gray-700 border-none text-gray-200">
            <button id="game-send-chat-button" class="p-2 rounded-lg bg-green-400 text-gray-900 font-bold hover:bg-green-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l4.47-1.49a1 1 0 00.5.074l7.108 2.373A1 1 0 0017 18.232l-7-14z"/></svg>
            </button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, addDoc, collection, query, where, getDocs, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Global Variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- Global State ---
        let currentScreen = 'login';
        let username = '';
        let opponentType = 'AI';
        let aiDifficulty = 'Medium';
        let winPoints = 5;
        let isOnline = false;
        let userId = null;
        let dbAuthReady = false;

        let onlineUsers = [];
        let gameHistory = [];
        let selectedOpponent = null;
        let chatLog = [];
        let incomingInviteFrom = null;
        let incomingInvitePoints = 5;
        let gameChatLog = [];

        // WebSocket
        let ws;
        const WS_URL = 'wss://kivymd-4.onrender.com';

        // Game State
        let gameTimer = null;
        let isGameActive = false;
        let playerY, opponentY;
        let ballX, ballY, ballVX, ballVY;
        let playerScore = 0, opponentScore = 0;
        let canvas, ctx;
        const PADDLE_HEIGHT = 120;
        const PADDLE_WIDTH = 12;
        const BALL_SIZE = 12;

        // --- DOM Elements ---
        const screens = {
            login: document.getElementById('login-screen'),
            lobby: document.getElementById('lobby-screen'),
            game: document.getElementById('game-screen')
        };
        const loginUsernameInput = document.getElementById('username');
        const loginPasswordInput = document.getElementById('password');
        const authButton = document.getElementById('auth-button');
        const toggleAuthButton = document.getElementById('toggle-auth-button');
        const offlineSwitch = document.getElementById('offline-switch');
        const errorMessage = document.getElementById('error-message');
        const lobbyUsernameSpan = document.getElementById('lobby-username');
        const opponentTypeSelect = document.getElementById('opponent-type');
        const aiOptionsDiv = document.getElementById('ai-options');
        const aiDifficultySelect = document.getElementById('ai-difficulty');
        const winPointsInput = document.getElementById('win-points');
        const humanOptionsDiv = document.getElementById('human-options');
        const showPlayersButton = document.getElementById('show-players-button');
        const onlineUsersListDiv = document.getElementById('online-users-list');
        const inviteStatus = document.getElementById('invite-status');
        const startGameButton = document.getElementById('start-game-button');
        const gameStatus = document.getElementById('game-status');
        const gameCanvas = document.getElementById('gameCanvas');
        const gameScoreDiv = document.getElementById('game-score');
        const gameOpponentNameSpan = document.getElementById('game-opponent-name');
        const gameExitButton = document.getElementById('game-exit-button');
        const helpModal = document.getElementById('help-modal');
        const inviteModal = document.getElementById('invite-modal');
        const inviteMessage = document.getElementById('invite-message');
        const declineInviteButton = document.getElementById('decline-invite-button');
        const acceptInviteButton = document.getElementById('accept-invite-button');
        const lobbyChatInput = document.getElementById('chat-input');
        const lobbySendChatButton = document.getElementById('send-chat-button');
        const lobbyChatLogDiv = document.getElementById('chat-log');
        const gameChatButton = document.getElementById('game-chat-button');
        const gameChatDrawer = document.getElementById('game-chat-drawer');
        const gameChatMessagesDiv = document.getElementById('game-chat-messages');
        const gameChatInput = document.getElementById('game-chat-input');
        const gameSendChatButton = document.getElementById('game-send-chat-button');

        // --- UI State Management ---
        function showScreen(screenName) {
            Object.values(screens).forEach(screen => screen.classList.remove('active'));
            screens[screenName].classList.add('active');
        }

        function showModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        // --- Firebase Auth & Firestore Setup ---
        async function signIn() {
            try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Firebase auth error:", error);
                showError('Authentication failed. Please check the console for details.');
            }
        }
        
        function getHistoryCollection() {
            const historyPath = isOnline ? `/artifacts/${appId}/users/${userId}/history` : `temp-history`;
            return collection(db, historyPath);
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userId = user.uid;
                dbAuthReady = true;
                // Since this is for a new app, we don't have existing history.
                // We'll just listen to new history added.
            } else {
                userId = crypto.randomUUID();
                dbAuthReady = true;
            }
        });

        // --- Login Screen Logic ---
        let isLoginMode = true;
        let isOfflineMode = false;

        toggleAuthButton.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            authButton.textContent = isLoginMode ? 'Login' : 'Sign Up';
            toggleAuthButton.textContent = isLoginMode ? "Don't have an account? Sign Up" : "Already have an account? Login";
        });

        offlineSwitch.addEventListener('change', (e) => {
            isOfflineMode = e.target.checked;
            authButton.textContent = isOfflineMode ? 'Play Offline' : (isLoginMode ? 'Login' : 'Sign Up');
            document.getElementById('auth-fields').style.display = isOfflineMode ? 'none' : 'flex';
        });

        authButton.addEventListener('click', async () => {
            errorMessage.classList.add('hidden');
            if (isOfflineMode) {
                username = "Guest";
                isOnline = false;
                showLobbyScreen();
                return;
            }

            const user = loginUsernameInput.value.trim();
            const pass = loginPasswordInput.value;
            if (!user || !pass) {
                showError("Please enter username and password.");
                return;
            }

            authButton.disabled = true;
            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, user + '@pong.com', pass);
                } else {
                    await createUserWithEmailAndPassword(auth, user + '@pong.com', pass);
                }
                username = user;
                isOnline = true;
                showLobbyScreen();
            } catch (error) {
                console.error("Auth error:", error);
                showError(error.code.replace('auth/', '').replace(/-/g, ' '));
            } finally {
                authButton.disabled = false;
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        // --- Lobby Screen Logic ---
        function showLobbyScreen() {
            showScreen('lobby');
            lobbyUsernameSpan.textContent = isOnline ? username : "Guest (Offline)";
            setupLobbyListeners();
            if (isOnline) {
              connectWebSocket();
            }
        }
        
        function setupLobbyListeners() {
            opponentTypeSelect.addEventListener('change', (e) => {
                opponentType = e.target.value;
                if (opponentType === 'AI') {
                    aiOptionsDiv.style.display = 'flex';
                    humanOptionsDiv.style.display = 'none';
                    startGameButton.textContent = 'Start Game';
                } else {
                    aiOptionsDiv.style.display = 'none';
                    humanOptionsDiv.style.display = 'block';
                    startGameButton.textContent = 'Start Game';
                }
            });
            aiDifficultySelect.addEventListener('change', (e) => {
                aiDifficulty = e.target.value;
            });
            winPointsInput.addEventListener('input', (e) => {
                winPoints = parseInt(e.target.value, 10) || 5;
            });

            showPlayersButton.addEventListener('click', () => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'getUsers' }));
                    onlineUsersListDiv.innerHTML = '<p class="text-center text-gray-400">Searching...</p>';
                } else {
                    onlineUsersListDiv.innerHTML = '<p class="text-center text-red-400">Not connected to server.</p>';
                }
            });

            startGameButton.addEventListener('click', () => {
                const requiredOpponent = opponentType === 'AI' ? 'AI' : selectedOpponent;
                if (!requiredOpponent) {
                    inviteStatus.textContent = 'Please select a human opponent or switch to AI mode.';
                    return;
                }
                if (opponentType === 'Human') {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        const inviteMsg = {
                            type: 'invite',
                            from: username,
                            to: selectedOpponent,
                            points: winPoints
                        };
                        ws.send(JSON.stringify(inviteMsg));
                        inviteStatus.textContent = `Invite sent to ${selectedOpponent}. Waiting...`;
                    }
                } else {
                    isGameActive = true;
                    startGame('AI');
                }
            });
            
            lobbySendChatButton.addEventListener('click', () => {
              if (selectedOpponent && lobbyChatInput.value.trim() !== '') {
                const message = {
                    type: 'chat',
                    from: username,
                    to: selectedOpponent,
                    message: lobbyChatInput.value.trim()
                };
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify(message));
                    chatLog.push(`Me (to ${selectedOpponent}): ${lobbyChatInput.value.trim()}`);
                    renderLobbyChat();
                    lobbyChatInput.value = '';
                }
              }
            });
        }
        
        function renderLobbyChat() {
            lobbyChatLogDiv.innerHTML = chatLog.map(msg => `<p>${msg}</p>`).join('');
            lobbyChatLogDiv.scrollTop = lobbyChatLogDiv.scrollHeight;
        }

        function renderOnlineUsers() {
            if (onlineUsers.length === 0) {
                 onlineUsersListDiv.innerHTML = `<p class="text-center text-gray-400">No other players online.</p>`;
                 return;
            }
            onlineUsersListDiv.innerHTML = '';
            onlineUsers.filter(u => u !== username).forEach(user => {
                const item = document.createElement('div');
                item.className = `list-item ${selectedOpponent === user ? 'selected' : ''}`;
                item.textContent = user;
                item.addEventListener('click', () => {
                    selectedOpponent = user;
                    renderOnlineUsers();
                });
                onlineUsersListDiv.appendChild(item);
            });
        }

        async function loadGameHistory() {
            if (!isOnline || !dbAuthReady) return;
            try {
                const historyRef = getHistoryCollection();
                const q = query(historyRef);
                const querySnapshot = await getDocs(q);
                gameHistory = [];
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.timestamp) {
                        const date = data.timestamp.toDate();
                        gameHistory.push(`${date.toISOString().substring(0, 19)} - Winner: ${data.winner} | Loser: ${data.loser}`);
                    }
                });
                gameHistory.sort((a, b) => b.localeCompare(a));
                renderGameHistory();
            } catch (e) {
                console.error("Error loading history:", e);
            }
        }
        
        async function saveGameHistory(winner, loser) {
            if (!isOnline || !dbAuthReady) return;
            try {
                const historyRef = getHistoryCollection();
                await addDoc(historyRef, {
                    winner: winner,
                    loser: loser,
                    timestamp: serverTimestamp()
                });
                console.log("History saved to Firestore.");
            } catch (e) {
                console.error("Error saving history:", e);
            }
        }
        
        function renderGameHistory() {
             const historyDiv = document.createElement('div');
             historyDiv.className = 'mt-4';
             historyDiv.innerHTML = `
                <h3 class="text-lg font-bold">Recent Games</h3>
                <div class="lobby-list-container h-32 mt-2">
                    ${gameHistory.slice(0, 5).map(h => `<p class="text-sm">${h}</p>`).join('')}
                </div>
             `;
             document.querySelector('#lobby-screen .card').appendChild(historyDiv);
        }

        // --- WebSocket Logic ---
        function connectWebSocket() {
            if (ws) ws.close();
            ws = new WebSocket(WS_URL);
            ws.onopen = () => {
                console.log("WebSocket connected.");
                ws.send(JSON.stringify({ type: 'join', name: username }));
            };
            ws.onmessage = handleWsMessage;
            ws.onclose = () => {
                console.log("WebSocket disconnected.");
            };
            ws.onerror = (error) => {
                console.error("WebSocket error:", error);
            };
        }

        function handleWsMessage(event) {
            const data = JSON.parse(event.data);
            switch (data.type) {
                case 'userlist':
                    onlineUsers = data.users;
                    renderOnlineUsers();
                    break;
                case 'invite':
                    if (data.to === username) {
                        incomingInviteFrom = data.from;
                        incomingInvitePoints = data.points;
                        inviteMessage.textContent = `${incomingInviteFrom} invited you to play Pong to ${incomingInvitePoints} points!`;
                        showModal('invite-modal');
                    }
                    break;
                case 'inviteResponse':
                    if (data.to === username) {
                        if (data.accept) {
                            opponentType = 'Human';
                            isGameActive = true;
                            winPoints = data.points;
                            startGame(data.from);
                            closeModal('invite-modal');
                        } else {
                            inviteStatus.textContent = `${data.from} declined your invitation.`;
                        }
                    }
                    break;
                case 'paddle':
                    if (isGameActive && gameOpponentNameSpan.textContent === data.from) {
                        opponentY = data.paddleY;
                    }
                    break;
                case 'score':
                    if (isGameActive && gameOpponentNameSpan.textContent === data.from) {
                        playerScore = data.opponentScore;
                        opponentScore = data.playerScore;
                    }
                    break;
                case 'chat':
                    if (isGameActive && gameOpponentNameSpan.textContent === data.from) {
                        gameChatLog.push(`${data.from}: ${data.message}`);
                        renderGameChat();
                    } else if (data.to === username) {
                        chatLog.push(`${data.from}: ${data.message}`);
                        renderLobbyChat();
                    }
                    break;
                case 'game_end':
                    if (data.to === username) {
                        endGameLocally();
                        gameStatus.textContent = `Winner: ${data.winner} | Loser: ${data.loser}`;
                        saveGameHistory(data.winner, data.loser);
                    }
                    break;
            }
        }
        
        declineInviteButton.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'inviteResponse',
                    from: username,
                    to: incomingInviteFrom,
                    accept: false
                }));
            }
            closeModal('invite-modal');
        });
        
        acceptInviteButton.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'inviteResponse',
                    from: username,
                    to: incomingInviteFrom,
                    accept: true,
                    points: incomingInvitePoints
                }));
            }
            startGame(incomingInviteFrom);
            closeModal('invite-modal');
        });

        // --- Game Logic ---
        function startGame(opponentName) {
            showScreen('game');
            gameOpponentNameSpan.textContent = opponentName;
            isGameActive = true;
            playerScore = 0;
            opponentScore = 0;
            gameChatLog = [];
            initGame();
        }

        function initGame() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            const gameWidth = canvas.width;
            const gameHeight = canvas.height;
            playerY = (gameHeight - PADDLE_HEIGHT) / 2;
            opponentY = (gameHeight - PADDLE_HEIGHT) / 2;
            ballX = gameWidth / 2 - BALL_SIZE / 2;
            ballY = gameHeight / 2 - BALL_SIZE / 2;
            ballVX = Math.random() < 0.5 ? 5 : -5;
            ballVY = Math.random() < 0.5 ? 3 : -3;
            
            gameTimer = requestAnimationFrame(gameLoop);
            
            gameCanvas.addEventListener('mousemove', onMouseMove);
            gameCanvas.addEventListener('touchmove', onTouchMove);
            gameCanvas.addEventListener('mousedown', onMouseDown);
            gameCanvas.addEventListener('touchstart', onTouchStart);
        }

        function onMouseMove(e) {
            const rect = gameCanvas.getBoundingClientRect();
            const scaleY = gameCanvas.height / rect.height;
            const y = (e.clientY - rect.top) * scaleY;
            playerY = Math.max(0, Math.min(y - PADDLE_HEIGHT / 2, gameCanvas.height - PADDLE_HEIGHT));
        }
        
        function onTouchMove(e) {
            e.preventDefault();
            const rect = gameCanvas.getBoundingClientRect();
            const scaleY = gameCanvas.height / rect.height;
            const y = (e.touches[0].clientY - rect.top) * scaleY;
            playerY = Math.max(0, Math.min(y - PADDLE_HEIGHT / 2, gameCanvas.height - PADDLE_HEIGHT));
        }

        function onMouseDown(e) {
            const rect = gameCanvas.getBoundingClientRect();
            const scaleY = gameCanvas.height / rect.height;
            const y = (e.clientY - rect.top) * scaleY;
            playerY = Math.max(0, Math.min(y - PADDLE_HEIGHT / 2, gameCanvas.height - PADDLE_HEIGHT));
        }
        
        function onTouchStart(e) {
            e.preventDefault();
            const rect = gameCanvas.getBoundingClientRect();
            const scaleY = gameCanvas.height / rect.height;
            const y = (e.touches[0].clientY - rect.top) * scaleY;
            playerY = Math.max(0, Math.min(y - PADDLE_HEIGHT / 2, gameCanvas.height - PADDLE_HEIGHT));
        }

        function gameLoop() {
            if (!isGameActive) return;
            updateGame();
            drawGame();
            gameTimer = requestAnimationFrame(gameLoop);
        }

        function updateGame() {
            const gameWidth = gameCanvas.width;
            const gameHeight = gameCanvas.height;
            
            ballX += ballVX;
            ballY += ballVY;

            // Wall collision
            if (ballY <= 0 || ballY + BALL_SIZE >= gameHeight) {
                ballVY *= -1;
            }

            // Paddle collision
            if (ballX <= 10 + PADDLE_WIDTH && ballY + BALL_SIZE > playerY && ballY < playerY + PADDLE_HEIGHT) {
                ballX = 10 + PADDLE_WIDTH;
                ballVX *= -1.05; // Increase speed
                ballVY += (ballY + BALL_SIZE/2 - (playerY + PADDLE_HEIGHT/2)) * 0.15;
            }
            if (ballX + BALL_SIZE >= gameWidth - 10 - PADDLE_WIDTH && ballY + BALL_SIZE > opponentY && ballY < opponentY + PADDLE_HEIGHT) {
                ballX = gameWidth - 10 - PADDLE_WIDTH - BALL_SIZE;
                ballVX *= -1.05; // Increase speed
                ballVY += (ballY + BALL_SIZE/2 - (opponentY + PADDLE_HEIGHT/2)) * 0.15;
            }

            // AI Logic
            if (opponentType === 'AI') {
                let aiSpeed;
                switch (aiDifficulty) {
                    case 'Easy': aiSpeed = 2; break;
                    case 'Medium': aiSpeed = 4; break;
                    case 'Hard': aiSpeed = 7; break;
                }
                const aiCenter = opponentY + PADDLE_HEIGHT / 2;
                if (aiCenter < ballY + BALL_SIZE/2 - 10) opponentY += aiSpeed;
                if (aiCenter > ballY + BALL_SIZE/2 + 10) opponentY -= aiSpeed;
                opponentY = Math.max(0, Math.min(opponentY, gameHeight - PADDLE_HEIGHT));
            }
            
            // Score
            if (ballX < 0) {
                opponentScore++;
                resetBall();
            } else if (ballX > gameWidth) {
                playerScore++;
                resetBall();
            }
            
            // Check for win condition
            if (playerScore >= winPoints) {
                endGame(username, gameOpponentNameSpan.textContent);
            } else if (opponentScore >= winPoints) {
                endGame(gameOpponentNameSpan.textContent, username);
            }
            
            gameScoreDiv.textContent = `${playerScore} : ${opponentScore}`;
            
            // Send updates via WebSocket for Human vs Human
            if (opponentType === 'Human' && ws && ws.readyState === WebSocket.OPEN) {
                const paddleMsg = { type: 'paddle', from: username, to: gameOpponentNameSpan.textContent, paddleY: playerY };
                ws.send(JSON.stringify(paddleMsg));
                const scoreMsg = { type: 'score', from: username, to: gameOpponentNameSpan.textContent, playerScore: playerScore, opponentScore: opponentScore };
                ws.send(JSON.stringify(scoreMsg));
            }
        }

        function drawGame() {
            const gameWidth = gameCanvas.width;
            const gameHeight = gameCanvas.height;
            
            // Background
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, gameWidth, gameHeight);
            
            // Center line
            ctx.fillStyle = 'white';
            for(let y = 0; y < gameHeight; y += 20) {
                ctx.fillRect(gameWidth / 2 - 2, y, 4, 12);
            }
            
            // Player paddle
            ctx.fillRect(10, playerY, PADDLE_WIDTH, PADDLE_HEIGHT);
            
            // Opponent paddle
            ctx.fillRect(gameWidth - 10 - PADDLE_WIDTH, opponentY, PADDLE_WIDTH, PADDLE_HEIGHT);
            
            // Ball
            ctx.beginPath();
            ctx.arc(ballX + BALL_SIZE/2, ballY + BALL_SIZE/2, BALL_SIZE/2, 0, Math.PI * 2);
            ctx.fill();
        }

        function resetBall() {
            const gameWidth = gameCanvas.width;
            const gameHeight = gameCanvas.height;
            ballX = gameWidth / 2 - BALL_SIZE / 2;
            ballY = gameHeight / 2 - BALL_SIZE / 2;
            ballVX = Math.random() < 0.5 ? 5 : -5;
            ballVY = Math.random() < 0.5 ? 3 : -3;
        }

        function endGame(winner, loser) {
            isGameActive = false;
            cancelAnimationFrame(gameTimer);
            if (isOnline) {
                saveGameHistory(winner, loser);
                ws.send(JSON.stringify({
                    type: 'game_end',
                    from: username,
                    to: loser,
                    winner: winner,
                    loser: loser
                }));
            }
            gameStatus.textContent = `Winner: ${winner} | Loser: ${loser}`;
            showScreen('lobby');
        }
        
        gameExitButton.addEventListener('click', () => {
          endGame(gameOpponentNameSpan.textContent, username);
        });
        
        gameChatButton.addEventListener('click', () => {
          gameChatDrawer.classList.add('active');
          renderGameChat();
        });
        
        gameSendChatButton.addEventListener('click', () => {
          const text = gameChatInput.value.trim();
          if (text === '') return;
          
          if (opponentType === 'Human' && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
              type: 'chat',
              from: username,
              to: gameOpponentNameSpan.textContent,
              message: text
            }));
          }
          
          gameChatLog.push(`${username}: ${text}`);
          renderGameChat();
          gameChatInput.value = '';
        });
        
        function renderGameChat() {
            gameChatMessagesDiv.innerHTML = gameChatLog.map(msg => `<p>${msg}</p>`).join('');
            gameChatMessagesDiv.scrollTop = gameChatMessagesDiv.scrollHeight;
        }

        // --- Initial Load ---
        window.onload = async () => {
            // First, sign in with the provided token or anonymously
            await signIn();
            showScreen('login');
        };
    </script>
