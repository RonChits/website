<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journey | Ronald Chitsatso</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a1f44;
            --primary-dark: #07152e;
            --secondary: #1a3a8f;
            --accent: #4cc9f0;
            --dark: #010814;
            --light: #f8f9fa;
            --gray: #adb5bd;
            --light-gray: #e5e5e5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
            padding-top: 80px; /* Added padding to account for fixed header */
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            line-height: 1.3;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            background: var(--primary);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            height: 80px; /* Fixed height for header */
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px; /* Match header height */
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
            font-family: 'Playfair Display', serif;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: rgba(255,255,255,0.9);
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            position: relative;
            padding: 5px 0;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-links a.active {
            color: white;
        }

        .nav-links a.active:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent);
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icons a {
            color: rgba(255,255,255,0.9);
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .social-icons a:hover {
            color: var(--accent);
        }

        /* Hero Section - Fixed to account for header */
        .hero {
            padding: 60px 0; /* Reduced top padding since we have body padding-top */
            text-align: center;
            background: var(--primary);
            color: white;
            margin-top: -80px; /* Negative margin to pull content up */
            padding-top: 140px; /* Extra padding to compensate */
        }

        /* Rest of your CSS remains the same */
        .hero-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .hero-image {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255,255,255,0.2);
            margin: 0 auto 25px;
            display: block;
        }

        /* ... rest of your existing CSS ... */

    </style>
</head>
<body>
    <!-- Header -->

                </div>
                <div class="social-icons">
                    <a href="https://www.linkedin.com/in/ronald-chitsatso-6b491a237/" target="_blank"><i class="fab fa-linkedin"></i></a>
                    <a href="https://github.com/RonChits" target="_blank"><i class="fab fa-github"></i></a>
                    <a href="mailto:r.i.chitsatso@gmail.com"><i class="fas fa-envelope"></i></a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container hero-content">
            <img src="images/IMG-20240906-WA0004.jpg" alt="Ronald Chitsatso" class="hero-image fade-in">
            <h1 class="fade-in">My Journey</h1>
            <p class="fade-in">Curious, open-minded, humble, and confident</p>
        </div>
    </section>

    <!-- Rest of your HTML remains the same -->

    <section class="contact">
        <!-- ... existing contact content ... -->
    </section>

    <!-- Footer -->
    <footer>
        <!-- ... existing footer content ... -->
    </footer>

    <script>
        // Header scroll effect
        window.addEventListener('scroll', function() {
            const header = document.getElementById('header');
            header.style.boxShadow = window.scrollY > 50 ? '0 2px 10px rgba(0,0,0,0.2)' : 'none';
        });

        // Intersection Observer for scroll animations
        const fadeElements = document.querySelectorAll('.fade-in');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, {
            threshold: 0.1
        });

        fadeElements.forEach(element => {
            observer.observe(element);
        });
    </script>
</body>
